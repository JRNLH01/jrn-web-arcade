<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solo Arcade</title><link rel="stylesheet" href="/assets/css/common.css"><style>
body{background:#f5f7fb;color:#182033;font-family:system-ui,sans-serif}.solo{max-width:850px;margin:32px auto;padding:20px}.panel{background:white;border-radius:20px;padding:24px;box-shadow:0 8px 30px #17203312}.muted{color:#667085}.btn,button{background:#5145cd;color:white;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:650;margin:4px}.btn.secondary,button.secondary{background:#e9e8ff;color:#39318f}input,select{padding:10px;border:1px solid #ccd2df;border-radius:8px;max-width:100%}#play{margin-top:16px}.grid{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(48px,1fr));max-width:500px}.tile{min-height:65px;font-size:20px}.board{display:grid;gap:5px;max-width:500px}.cell{background:#eef0f6;border-radius:7px;min-height:42px;display:grid;place-items:center;cursor:pointer}.status{font-weight:700;margin:12px 0}.swatch{height:130px;border-radius:12px;margin:12px 0}.actions{margin-top:14px}.draw{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;max-width:500px}.pixel{aspect-ratio:1;background:#f1f2f6;border:0;margin:0;padding:0;border-radius:2px}.maze{display:grid;gap:2px;max-width:460px}.maze button{margin:0;padding:0;border-radius:3px;aspect-ratio:1}.small{font-size:14px}
</style></head><body><main class="solo"><a href="/">← All games</a><section class="panel"><p class="muted">MINI GAME ARCADE · SOLO MODE</p><h1 id="title">Solo game</h1><p id="intro" class="muted">Play at your own pace.</p><div id="setup"></div><div id="play"></div><div class="actions"><button class="secondary" onclick="location.href='/'">Back to arcade</button></div></section></main><script src="/solo.js"></script></body></html>
